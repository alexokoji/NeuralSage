# Render Blueprint — NeuralTrade (single-service edition)
#
# This blueprint runs the entire backend (HTTP API + trading loop +
# AI optimization + daily rollover) inside ONE Web Service via the
# in-process APScheduler. No paid Celery worker is required.
#
# Provisioned:
#   * Managed Postgres (Starter, $7/mo — or free for 90 days on first signup)
#   * FastAPI backend (Web, Starter, $7/mo)
#   * Next.js frontend (Web, Starter, $7/mo — comment out if hosting on Vercel)
#
# Redis is OPTIONAL. The app falls back to in-memory implementations for
# the rate limiter, market-data cache, and notification pubsub when
# REDIS_URL is empty. Add a Render Key Value service later if you need
# multi-instance scaling.
#
# Two secrets must be set manually in the Render dashboard before first
# deploy: JWT_SECRET_KEY and ENCRYPTION_KEY. Generate them locally with:
#   python -c "import secrets; print(secrets.token_urlsafe(64))"
#   python -c "import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())"

# ---------------------------------------------------------------------------
# Managed Postgres
# ---------------------------------------------------------------------------
databases:
  - name: neuraltrade-db
    databaseName: neuraltrade
    user: neuraltrade
    plan: starter
    postgresMajorVersion: "16"
    ipAllowList: []         # private network only

# ---------------------------------------------------------------------------
# Shared environment variables
# ---------------------------------------------------------------------------
envVarGroups:
  - name: neuraltrade-shared
    envVars:
      # Pin Python to a version with prebuilt wheels for pydantic-core,
      # scikit-learn, cryptography, etc.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: NeuralTrade
      # Single backend service drives all background work itself.
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: "true"
      # Trading hard caps. Override per environment in the dashboard.
      - key: MAX_RISK_PER_TRADE_PCT
        value: "2.0"
      - key: MAX_DAILY_DRAWDOWN_PCT
        value: "5.0"
      - key: MAX_CONCURRENT_TRADES
        value: "5"
      - key: MAX_CONSECUTIVE_LOSSES
        value: "3"
      - key: TRADE_LOOP_INTERVAL_SECONDS
        value: "15"
      - key: OPTIMIZATION_INTERVAL_HOURS
        value: "6"
      # Exchange endpoints (override only if you proxy traffic).
      - key: BYBIT_REST_URL
        value: https://api.bybit.com
      - key: BYBIT_TESTNET_REST_URL
        value: https://api-testnet.bybit.com
      - key: BITGET_REST_URL
        value: https://api.bitget.com
      # Secrets — must be set in the dashboard, NOT in this file.
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Set after the frontend service URL is known. Comma-separated.
      - key: APP_CORS_ORIGINS
        sync: false

services:
  # -------------------------------------------------------------------------
  # FastAPI backend — also drives the trading loop + AI optimization
  # via APScheduler inside the same process.
  # -------------------------------------------------------------------------
  - type: web
    name: neuraltrade-backend
    runtime: python
    plan: starter
    rootDir: backend
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Run migrations every boot. Idempotent on warm starts.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: neuraltrade-shared
      - key: DATABASE_URL
        fromDatabase:
          name: neuraltrade-db
          property: connectionString

  # -------------------------------------------------------------------------
  # Next.js frontend (optional — Vercel is also fine; remove if hosting elsewhere)
  # -------------------------------------------------------------------------
  - type: web
    name: neuraltrade-frontend
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set in the dashboard once the backend service URL is known.
      # Format: https://neuraltrade-backend.onrender.com (no trailing slash).
      - key: NEXT_PUBLIC_API_URL
        sync: false
