# Render Blueprint — NeuralTrade
#
# This file describes the full stack so a single "New → Blueprint" import
# brings up Postgres, Redis, FastAPI backend, the combined Celery
# worker+beat, and (optionally) the Next.js frontend.
#
# Two secrets must be set manually in the Render dashboard before first
# deploy: JWT_SECRET_KEY and ENCRYPTION_KEY. Generate them locally with:
#   python -c "import secrets; print(secrets.token_urlsafe(64))"
#   python -c "import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())"
#
# Free tier note: Postgres, Redis, and the worker are NOT free. The worker
# in particular must stay awake to drive the trading loop — Starter is the
# minimum sane plan there.

# ---------------------------------------------------------------------------
# Managed Postgres
# ---------------------------------------------------------------------------
databases:
  - name: neuraltrade-db
    databaseName: neuraltrade
    user: neuraltrade
    plan: starter           # $7/mo, 256 MB RAM, 1 GB storage
    postgresMajorVersion: "16"
    ipAllowList: []         # private network only

# ---------------------------------------------------------------------------
# Shared environment variables (DRY between backend + worker)
# ---------------------------------------------------------------------------
envVarGroups:
  - name: neuraltrade-shared
    envVars:
      # Pin Python to a version with prebuilt wheels for pydantic-core,
      # scikit-learn, cryptography, etc. 3.14 is too new — falls back to
      # source builds and Render's build env has a read-only Cargo cache.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: NeuralTrade
      # Trading hard caps. Override per environment in the dashboard.
      - key: MAX_RISK_PER_TRADE_PCT
        value: "2.0"
      - key: MAX_DAILY_DRAWDOWN_PCT
        value: "5.0"
      - key: MAX_CONCURRENT_TRADES
        value: "5"
      - key: MAX_CONSECUTIVE_LOSSES
        value: "3"
      - key: TRADE_LOOP_INTERVAL_SECONDS
        value: "15"
      - key: OPTIMIZATION_INTERVAL_HOURS
        value: "6"
      # Exchange endpoints (override only if you proxy traffic).
      - key: BYBIT_REST_URL
        value: https://api.bybit.com
      - key: BYBIT_TESTNET_REST_URL
        value: https://api-testnet.bybit.com
      - key: BITGET_REST_URL
        value: https://api.bitget.com
      # Secrets — must be set in the dashboard, NOT in this file.
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Set after the frontend service URL is known. Comma-separated.
      - key: APP_CORS_ORIGINS
        sync: false

services:
  # -------------------------------------------------------------------------
  # Redis (Render Key Value) — cache + Celery broker + pubsub
  # -------------------------------------------------------------------------
  - type: redis
    name: neuraltrade-redis
    plan: starter           # $10/mo, 25 MB
    ipAllowList: []         # private only
    maxmemoryPolicy: allkeys-lru

  # -------------------------------------------------------------------------
  # FastAPI backend
  # -------------------------------------------------------------------------
  - type: web
    name: neuraltrade-backend
    runtime: python
    plan: starter           # $7/mo, 512 MB
    rootDir: backend
    region: oregon          # change to a region near your exchange edge
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Run migrations every boot. Idempotent; cheap on warm starts.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: neuraltrade-shared
      - key: DATABASE_URL
        fromDatabase:
          name: neuraltrade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neuraltrade-redis
          property: connectionString

  # -------------------------------------------------------------------------
  # Celery worker (with embedded beat scheduler via -B)
  # -------------------------------------------------------------------------
  - type: worker
    name: neuraltrade-worker
    runtime: python
    plan: starter           # $7/mo. Run a single instance; beat must be singleton.
    rootDir: backend
    region: oregon
    autoDeploy: true
    numInstances: 1
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app:celery_app worker --beat --loglevel=info --concurrency=2
    envVars:
      - fromGroup: neuraltrade-shared
      - key: DATABASE_URL
        fromDatabase:
          name: neuraltrade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neuraltrade-redis
          property: connectionString

  # -------------------------------------------------------------------------
  # Next.js frontend (optional — Vercel is also fine; comment out if hosting elsewhere)
  # -------------------------------------------------------------------------
  - type: web
    name: neuraltrade-frontend
    runtime: node
    plan: starter           # $7/mo. Use "free" only if you accept cold starts.
    region: oregon
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render only exposes `host`/`port` (not a scheme'd URL) via fromService,
      # and the typed API client requires the full `https://...`. Set this in
      # the dashboard once the backend service is live; format:
      #   https://neuraltrade-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
